name: CI/CD Pipeline - VoluMetric Stock Research

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Verify (CI Test & Build Check)
  # -------------------------------------------------------------
  build-and-test:
    name: 🧪 CI Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Checks
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Validate Backend Code & Imports
        run: |
          python -c "import fastapi, yfinance, pandas, numpy; print('All core Python modules loaded successfully.')"

      # Frontend Checks
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Production Bundle
        working-directory: ./frontend
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: CD Deploy Backend to Render Cloud
  # -------------------------------------------------------------
  deploy-backend:
    name: 🚀 CD Deploy Backend (Render Cloud)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deployment Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # -------------------------------------------------------------
  # Job 3: CD Deploy Frontend to Vercel
  # -------------------------------------------------------------
  deploy-frontend:
    name: 🌐 CD Deploy Frontend (Vercel)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
